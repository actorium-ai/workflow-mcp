name: Publish to npm

# Triggered only by pushing a version tag (e.g. `v0.2.0`) — never on a plain
# push to main, so publishing is always a deliberate, explicit act tied to a
# specific commit and version, not an accidental side effect of merging.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) — no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Trusted publishing needs npm >= 11.5.1 — pin explicitly rather than
      # relying on whatever setup-node's Node 22 build happens to bundle.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test

      # Guards against publishing the wrong version — the tag is the source
      # of truth for "what we intend to release," package.json must agree.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: pnpm run build

      # Uses npm (not pnpm publish) — OIDC trusted publishing is implemented
      # in the npm CLI itself. It reads publishConfig.access from
      # package.json, and --provenance attaches a signed build attestation
      # now that we're publishing via OIDC anyway.
      - run: npm publish --provenance
